<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <link rel="icon" href="/favicon.png" />
  <title>Bowling Stat Tracker</title>

  <!-- css files for each component -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/upload.css" />
  <link rel="stylesheet" href="css/frames.css" />
  <link rel="stylesheet" href="css/players.css" />
  <link rel="stylesheet" href="css/history.css" />
  <link rel="stylesheet" href="css/stats.css" />
  <link rel="stylesheet" href="css/statsAdvanced.css" />
  <link rel="stylesheet" href="css/highlights.css" />

</head>

<body>
  <main>
    <nav class="nav-bar" id="nav-bar">
      <div class="nav-links">
        <button type="button" class="nav-link-btn" id="nav-link-me">Me</button>
        <button type="button" class="nav-link-btn active" id="nav-link-players">Players</button>
      </div>

      <form class="nav-search-form" onsubmit="return false;">
        <input type="text" id="history-search" class="nav-search" placeholder="search your games..." />
      </form>

      <div class="nav-account">
        <div class="nav-login-btn-container" id="nav-login-trigger" style="display:none;">
          <button class="nav-login-btn" id="nav-login-btn">Sign in</button>
        </div>

        <div class="nav-avatar-container" id="nav-avatar-container" style="display:none;">
          <div class="nav-avatar" id="nav-avatar"></div>
          <div class="nav-dropdown" id="nav-dropdown" style="display:none;">
            <button class="nav-dropdown-item muted" id="nav-dropdown-email"></button>
            <button class="nav-dropdown-item" id="nav-logout-btn">Log out</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="auth-panel" id="auth-panel">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" data-tab="login">Sign in</button>
        <button class="auth-tab" id="tab-signup" data-tab="signup">Create account</button>
      </div>

      <form id="auth-form">
        <div class="field">
          <label for="auth-email" id="auth-email-label">Email</label>
          <input type="text" id="auth-email" autocomplete="email" required />
        </div>
        <div class="field" id="username-field" style="display:none;">
          <label for="auth-username">Username</label>
          <input type="text" id="auth-username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-auth-submit" id="auth-submit">Sign in</button>
        <p class="auth-error" id="auth-error"></p>
      </form>
      <button type="button" class="link-btn" id="forgot-password-btn" style="margin-top:14px;">Forgot password?</button>
    </div>

    <div class="auth-panel" id="verify-panel">
      <div class="auth-tabs">
        <span class="auth-tab active">Verify your email</span>
      </div>
      <form id="verify-form">
        <p class="result-hint" id="verify-hint">Enter the 6-digit code we emailed you.</p>
        <div class="field">
          <label for="verify-code">Verification code</label>
          <input type="text" id="verify-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required />
        </div>
        <button type="submit" class="btn-auth-submit" id="verify-submit">Verify</button>
        <p class="auth-error" id="verify-error"></p>
      </form>
      <button type="button" class="link-btn" id="resend-code-btn" style="margin-top:10px;">Resend code</button>
      <button type="button" class="link-btn" id="verify-back-btn" style="margin-top:10px; margin-left:14px;">Back to
        sign in</button>
    </div>

    <div class="auth-panel" id="forgot-panel">
      <div class="auth-tabs">
        <span class="auth-tab active">Reset password</span>
      </div>
      <form id="forgot-request-form">
        <p class="result-hint" id="forgot-hint">Enter your account email and we'll send a reset code.</p>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" autocomplete="email" required />
        </div>
        <button type="submit" class="btn-auth-submit" id="forgot-request-submit">Send reset code</button>
        <p class="auth-error" id="forgot-request-error"></p>
      </form>

      <form id="forgot-reset-form" style="display:none;">
        <div class="field">
          <label for="reset-code">Reset code</label>
          <input type="text" id="reset-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required />
        </div>
        <div class="field">
          <label for="reset-new-password">New password</label>
          <input type="password" id="reset-new-password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn-auth-submit" id="forgot-reset-submit">Reset password</button>
        <p class="auth-error" id="forgot-reset-error"></p>
      </form>

      <button type="button" class="link-btn" id="forgot-back-btn" style="margin-top:10px;">Back to sign in</button>
    </div>

    <div id="app-content">
      <label class="dropzone" id="dropzone" for="file-input">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <p class="primary">Drop a scoreboard photo, or click to choose one</p>
        <p class="secondary">JPEG, PNG, WEBP, or HEIC</p>
      </label>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple />

      <p class="status" id="status"></p>

      <div class="result" id="result">
        <div class="result-header">
          <span class="label">Review &amp; edit before saving</span>
        </div>
        <p class="result-hint">Fix any misread rolls, then save. Allowed symbols: X, 1-9, /, -, F</p>
        <div class="result-meta">
          <label for="edited-datetime">Date / time</label>
          <input type="datetime-local" id="edited-datetime" />
        </div>
        <div class="player-rows" id="player-rows"></div>
        <div class="thumb-row">
          <div class="thumb-zoom-wrap" id="thumb-zoom-wrap">
            <img id="result-thumb" alt="Uploaded scoreboard" />
            <button type="button" class="thumb-zoom-reset" id="thumb-zoom-reset" aria-label="Reset zoom">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <p class="thumb-filename" id="thumb-filename"></p>
        </div>
        <p class="status" id="queue-progress"></p>
        <div class="result-actions">
          <button type="button" class="btn btn-primary btn-save" id="save-btn">Save game</button>
          <button type="button" class="btn btn-discard" id="discard-btn">Discard</button>
          <button type="button" class="btn btn-delete" id="delete-btn" style="display:none;">Delete game</button>
        </div>
        <p class="save-error" id="save-error"></p>
      </div>

      <section class="history">
        <h2>Your previous games</h2>
        <div id="history-list"></div>
      </section>
    </div>

    <div id="players-content">
      <div id="players-list-view">
        <div id="players-list"></div>
      </div>

      <div id="player-detail-view" style="display:none;">
        <button type="button" class="link-btn" id="player-detail-back">&larr; Back</button>
        <h2 id="player-detail-name"></h2>
        <div id="player-detail-history"></div>
      </div>
    </div>
  </main>

  <button type="button" class="stats-toggle" id="stats-toggle" aria-label="Toggle stats panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <aside class="stats-panel" id="stats-panel">
    <h2 id="stats-panel-title">Stats</h2>
    <button type="button" class="stats-advanced-btn" id="stats-advanced-btn">Advanced stats</button>
    <div class="stats-range-toggle" id="stats-range-toggle">
      <button type="button" class="stats-range-btn active" data-range="all">All</button>
      <button type="button" class="stats-range-btn" data-range="20">Last 20</button>
    </div>
    <div id="stats-content"></div>
  </aside>

  <button type="button" class="highlights-toggle" id="highlights-toggle" aria-label="Toggle highlights panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <aside class="highlights-panel" id="highlights-panel">
    <h2>Highlights</h2>
    <div id="highlights-list"></div>
  </aside>

  <div class="emoji-picker" id="emoji-picker" style="display:none;"></div>

  <div class="confirm-modal-overlay" id="confirm-modal-overlay" style="display:none;">
    <div class="confirm-modal">
      <p id="confirm-modal-message"></p>
      <div class="confirm-modal-actions">
        <button type="button" class="btn btn-delete" id="confirm-modal-ok">Delete</button>
        <button type="button" class="btn btn-discard" id="confirm-modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div class="history-item-dropdown" id="history-item-dropdown" style="display:none;">
    <button type="button" class="dropdown-item" id="history-dropdown-edit">Edit</button>
    <button type="button" class="dropdown-item" id="history-dropdown-delete">Delete</button>
  </div>

  <div class="stats-advanced-overlay" id="stats-advanced-overlay" style="display:none;">
    <div class="stats-advanced-header">
      <div class="stats-advanced-header-inner">
        <button type="button" class="link-btn" id="stats-advanced-back">&larr; Back</button>
        <h2 id="stats-advanced-title"></h2>
      </div>
    </div>

    <div class="stats-advanced-panel">
      <div id="stats-advanced-body"></div>
    </div>

    <button type="button" class="stats-advanced-toggle stats-toggle" id="stats-advanced-toggle"
      aria-label="Toggle stats panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <aside class="stats-advanced-side stats-panel" id="stats-advanced-side">
      <div class="stats-range-toggle" id="stats-advanced-range-toggle">
        <button type="button" class="stats-range-btn active" data-range="all">All</button>
        <button type="button" class="stats-range-btn" data-range="20">Last 20</button>
      </div>
      <div id="stats-advanced-summary"></div>
    </aside>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
